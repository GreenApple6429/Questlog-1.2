<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Questlog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Figtree:wght@400;500;600;700;800&family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@500;700&family=DotGothic16&family=Space+Grotesk:wght@500;700&family=Fredoka:wght@500;700&family=Fraunces:wght@500;700&family=Orbitron:wght@500;700&family=MedievalSharp&family=Cinzel:wght@500;700&family=Bungee&family=VT323&family=Caveat:wght@500;700&family=Righteous&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Profile + XP bar on top, five tabs at the bottom.
   Look is driven by tokens: theme (data-qt), font (data-qf), style (data-qs), set from Settings. */
:root{
  --bg:#12102a; --panel:#1c1940; --panel2:#272253; --line:#3a3373; --shadow:#07061a;
  --ink:#f2efff; --muted:#a8a3d6; --acc:#ffc83d; --acc-ink:#2a1d00; --acc-deep:#b57f00; --acc-hi:#fff0b8;
  --good:#4be08a; --bad:#ff5d73; --pl:60%;
  --bw:2px; --r:16px; --rb:13px; --sh:0 4px 0 var(--shadow); --shp:0 1px 0 var(--shadow);
  --font-display:'Pixelify Sans','Courier New',monospace;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-qt="day"]{--bg:#f1eff9;--panel:#ffffff;--panel2:#e9e6f6;--line:#c9c3e6;--shadow:#c5bfe2;--ink:#1c1938;--muted:#5a5590;--acc:#f2a900;--acc-ink:#2a1d00;--acc-deep:#b97f00;--acc-hi:#ffd45e;--good:#14a85a;--bad:#d93a54;--pl:36%;color-scheme:light}
:root[data-qt="forest"]{--bg:#0f1e17;--panel:#173326;--panel2:#1f4533;--line:#2f6a4d;--shadow:#07110c;--ink:#eafff3;--muted:#9fcdb3;--acc:#ffd166;--acc-ink:#2a2000;--acc-deep:#b58a1c;--acc-hi:#fff0b8;--good:#5cf29a;--bad:#ff6b7d}
:root[data-qt="ocean"]{--bg:#0b1a2e;--panel:#12294a;--panel2:#193761;--line:#2b5a96;--shadow:#050d1a;--ink:#eaf4ff;--muted:#9bbbe0;--acc:#4fd1ff;--acc-ink:#042335;--acc-deep:#1f85ad;--acc-hi:#c3f0ff;--good:#4be0a0;--bad:#ff6b85}
:root[data-qt="contrast"]{--bg:#000000;--panel:#0b0b0b;--panel2:#1c1c1c;--line:#ffffff;--shadow:#3a3a3a;--ink:#ffffff;--muted:#dcdcdc;--acc:#ffe600;--acc-ink:#000000;--acc-deep:#a89a00;--acc-hi:#fff7a0;--good:#3dff8a;--bad:#ff5252;--pl:62%}
:root[data-qf="clean"]{--font-display:'Figtree',system-ui,sans-serif}
:root[data-qf="readable"]{--font-display:'Atkinson Hyperlegible',system-ui,sans-serif;--font-body:'Atkinson Hyperlegible',system-ui,sans-serif}
:root[data-qf="rounded"]{--font-display:'Nunito',system-ui,sans-serif;--font-body:'Nunito',system-ui,sans-serif}
:root[data-qs="soft"]{--bw:1px;--r:24px;--rb:18px;--sh:0 10px 26px -12px rgba(0,0,0,.55);--shp:0 2px 8px -3px rgba(0,0,0,.45)}
:root[data-qs="flat"]{--bw:1px;--r:10px;--rb:9px;--sh:none;--shp:none}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:500 15px/1.4 var(--font-body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible,.task:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{flex:none;display:block}
.shell{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-bottom:150px;display:grid;gap:14px}
.card{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.muted{color:var(--muted)}
.disp{font-family:var(--font-display);font-weight:700}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* hero */
.hero{display:flex;align-items:center;gap:8px;padding-block:14px 12px}
.hero-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;border-radius:var(--r);padding:2px}
.hero-main:active{opacity:.85}
.lvl{width:56px;height:56px;flex:none;display:grid;place-content:center;justify-items:center;background:var(--acc);color:var(--acc-ink);border:var(--bw) solid var(--acc-hi);border-radius:20px;box-shadow:0 4px 0 var(--acc-deep);font-family:var(--font-display)}
:root[data-qs="soft"] .lvl,:root[data-qs="flat"] .lvl{box-shadow:none}
.lvl span{font-size:10px;letter-spacing:.12em;line-height:1}
.lvl b{font-size:26px;line-height:1.05}
.avatar{position:relative;width:56px;height:56px;flex:none}
.avatar img{width:56px;height:56px;border-radius:20px;object-fit:cover;border:var(--bw) solid var(--acc);display:block}
.avatar .chip{position:absolute;right:-6px;bottom:-6px;background:var(--acc);color:var(--acc-ink);font:700 11px var(--font-display);padding:1px 6px;border-radius:99px}
.hero-mid{flex:1;min-width:0;display:grid;gap:5px}
.hero-name{display:grid;gap:0;min-width:0;line-height:1.2}
.hero-name b{font-family:var(--font-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-name span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{display:block;height:14px;background:var(--panel2);border:var(--bw) solid var(--line);border-radius:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background-color:var(--acc);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.18) 6px 8px);transition:width .45s}
.xptext{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.hero-side{display:flex;align-items:center;gap:0;flex:none}
.flame{display:flex;align-items:center;gap:1px;color:var(--muted);font-family:var(--font-display);font-size:24px;line-height:1;min-width:48px;justify-content:center;padding:0 2px}
.flame svg{display:block}
.flame.on{color:#ffb23d;text-shadow:0 0 10px rgba(255,140,40,.55)}
.flame.on svg{filter:drop-shadow(0 0 5px rgba(255,130,30,.75));animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.08) rotate(1.5deg)}}
.tok{display:flex;align-items:center;gap:3px;height:36px;padding:0 9px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font:700 15px var(--font-display);animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,.0)}50%{box-shadow:0 0 0 5px rgba(255,200,61,.28)}}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:var(--rb);color:var(--muted)}
.icon-btn:active{background:var(--panel2)}

/* date nav */
.datenav{display:flex;align-items:center;gap:6px}
.datenav .when{flex:1;text-align:center;display:grid;gap:0}
.datenav .when b{font-family:var(--font-display);font-size:19px}
.datenav .when span{font-size:12px;color:var(--muted)}
.datenav .jump{font-size:12px;font-weight:800;color:var(--acc);width:auto;padding:0 8px}
.bigdate{display:grid;gap:0;padding:2px 4px}
.bigdate b{font-family:var(--font-display);font-size:30px;line-height:1.1}
.bigdate span{color:var(--muted);font-size:13px}

/* progress card */
.progress{display:grid;gap:10px;padding:14px 16px}
.progress .top{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:27px}
.progress h2{font-family:var(--font-display);font-size:21px}
.praise{font:600 13px var(--font-body);color:var(--muted);margin-left:6px;font-style:italic}
.progress p{color:var(--muted);font-size:13.5px;margin-top:2px}
.progress .xp-today{margin-top:8px;display:inline-block;font-size:12px;font-weight:800;color:var(--acc)}
.slogan{border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px;color:var(--muted);font-style:italic}
.notice{padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:13.5px}
.notice p{flex:1}
.notice button{font-weight:800;color:var(--acc);padding:4px 2px}

/* quest rows */
.sect{font-family:var(--font-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 2px 0}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px 10px 10px;text-align:left;cursor:pointer;transition:transform .08s,box-shadow .08s;-webkit-user-select:none;user-select:none;width:100%}
.task:active{transform:translateY(3px);box-shadow:var(--shp)}
.task.late{border-color:var(--bad)}
.task.done{opacity:.78}
.task.done .t-name{text-decoration:line-through;text-decoration-color:var(--muted)}
.task.ro{cursor:default}
.task.ro:active{transform:none;box-shadow:var(--sh)}
.chk{position:relative;width:58px;height:58px;border-radius:var(--rb);background:var(--panel2);border:var(--bw) dashed var(--muted);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--muted)}
.chk svg{opacity:.4}
.chk.part{color:var(--acc);border-color:var(--acc);border-style:solid}
.chk.full{background:var(--good);border:var(--bw) solid var(--acc-hi);color:#06301a}
.chk.full svg{opacity:1}
.chk.miss{border-color:var(--bad);border-style:solid;color:var(--bad)}
.chk.miss svg{opacity:1}
.chk.pop{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
.chk.pop::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:3px solid var(--good);animation:ripple .6s ease-out forwards}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.t-body{min-width:0;display:grid;gap:3px}
.t-name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);align-items:center}
.t-meta span{display:inline-flex;align-items:center;gap:4px}
.t-side{display:flex;align-items:center;gap:4px}
.xpchip{font-family:var(--font-display);font-size:14px;color:var(--acc);white-space:nowrap}
:root[data-qt="day"] .xpchip,:root[data-qt="day"] .progress .xp-today,:root[data-qt="day"] .notice button,:root[data-qt="day"] .datenav .jump{color:#9a6a00}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;line-height:1.5}
.pill.late{background:var(--bad);color:#2b0007}
.pill.next{background:var(--acc);color:var(--acc-ink)}
.empty{padding:26px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty h3{font-family:var(--font-display);font-size:19px}
.empty p{color:var(--muted);max-width:32ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--rb);border:var(--bw) solid var(--line);background:var(--panel2);box-shadow:var(--sh);font-weight:700;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:var(--shp)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc-hi);box-shadow:0 4px 0 var(--acc-deep)}
:root[data-qs="soft"] .btn.primary,:root[data-qs="flat"] .btn.primary{box-shadow:var(--sh)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);color:#2b0007;border-color:#ffc0c9}
.btn.sm{min-height:40px;padding:0 13px;font-size:13.5px}
#fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);border:var(--bw) solid var(--acc-hi);box-shadow:0 5px 0 var(--acc-deep);z-index:20}
:root[data-qs="soft"] #fab,:root[data-qs="flat"] #fab{box-shadow:var(--sh)}
#fab[hidden]{display:none}
#fab:active{transform:translateY(3px)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:var(--bw) solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav .row{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:grid;justify-items:center;gap:2px;padding:9px 0 8px;color:var(--muted);font-size:11px;font-weight:700;position:relative}
nav button[aria-current=page]{color:var(--acc)}
:root[data-qt="day"] nav button[aria-current=page]{color:#9a6a00}
nav button[aria-current=page]::before{content:"";position:absolute;top:calc(var(--bw) * -1);left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}

/* segmented + chips */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;padding:0 13px;border-radius:var(--rb);border:var(--bw) solid var(--line);background:var(--panel2);font-weight:700;font-size:13.5px;text-align:center}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.seg.fill button{flex:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{min-height:46px;display:grid;place-items:center;text-align:center;border-radius:var(--rb);border:var(--bw) solid var(--line);background:var(--panel2);font-weight:800}
.days button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.swatches button{height:54px;border-radius:var(--rb);border:var(--bw) solid var(--line);display:grid;place-items:end center;padding-bottom:4px;font-size:10.5px;font-weight:800;position:relative;overflow:hidden}
.swatches button[aria-pressed=true]{outline:3px solid var(--acc);outline-offset:1px}
.swatches button i{position:absolute;top:8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%}

/* stats */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 div{padding:10px 8px;text-align:center;display:grid;gap:0}
.stat3 b{font-family:var(--font-display);font-size:26px;line-height:1.15}
.stat3 span{font-size:11.5px;color:var(--muted);font-weight:600}
.panel{padding:14px 14px 12px;display:grid;gap:10px;min-width:0}
.panel h3{font-family:var(--font-display);font-size:17px}
.panel .sub{font-size:12.5px;color:var(--muted);margin-top:-6px}
.big{display:flex;align-items:baseline;gap:10px}
.big b{font-family:var(--font-display);font-size:40px;line-height:1}
.big span{color:var(--muted);font-size:13px}
.hint{font-size:12.5px;color:var(--muted)}
.rows{display:grid;gap:12px}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.trow .n{font-weight:600;overflow-wrap:anywhere}
.trow .p{font-family:var(--font-display);font-weight:700}
.trow .meter{grid-column:1/-1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.trow .meter i{display:block;height:100%;border-radius:4px}
.tablewrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
table.wk{border-collapse:separate;border-spacing:4px;width:100%;min-width:0}
table.wk th{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px 2px 4px;max-width:70px;overflow-wrap:anywhere;line-height:1.2;vertical-align:bottom}
table.wk th.day,table.wk td.day{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;white-space:nowrap}
table.wk td.day{font-weight:700;font-size:13px;padding-right:6px}
table.wk td.day small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
table.wk td{text-align:center;padding:0;height:36px}
table.wk td.pct{font-family:var(--font-display);font-weight:700;font-size:15px;white-space:nowrap;padding-left:4px}
table.wk tr.today td.day b{color:var(--acc)}
table.wk tfoot td{padding-top:6px;border-top:var(--bw) solid var(--line)}
.cell{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;font-size:11px;font-weight:800;line-height:1}
.cell.done{background:var(--good);color:#06301a}
.cell.miss{background:var(--bad);color:#2b0007}
.cell.part{background:transparent;border:2px solid var(--acc);color:var(--acc)}
:root[data-qt="day"] .cell.part{color:#9a6a00;border-color:#d99a00}
.cell.pending{border:2px dashed var(--muted);border-radius:50%}
.cell.future,.cell.na{color:var(--muted);opacity:.5;font-size:16px}
.legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600}
.legend i{flex:1;height:10px;border-radius:5px;background:linear-gradient(90deg,hsl(0 80% var(--pl)),hsl(65 80% var(--pl)),hsl(130 80% var(--pl)))}

/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calgrid .wh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-day{min-height:54px;border-radius:12px;border:var(--bw) solid transparent;background:var(--panel2);display:grid;align-content:center;justify-items:center;gap:0;position:relative;padding:2px 0}
.cal-day b{font-size:15px;line-height:1.1}
.cal-day small{font-size:9.5px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.cal-day.blank{background:none;border:0;pointer-events:none}
.cal-day.today b{color:var(--acc)}
:root[data-qt="day"] .cal-day.today b{color:#9a6a00}
.cal-day.sel{outline:3px solid var(--ink);outline-offset:1px}
.cal-day.future{background:transparent;border:var(--bw) dashed var(--line);color:var(--muted)}
.cal-day .dotmark{width:5px;height:5px;background:var(--muted);border-radius:1px;margin-top:3px}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mini li{display:flex;align-items:center;gap:10px}
.mini li span.n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}

/* tips */
.pomo{display:grid;gap:12px;padding:16px;justify-items:center;text-align:center}
.pomo .mode{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pomo .clock{font-family:var(--font-display);font-weight:700;font-size:64px;line-height:1}
.pomo .acts{display:flex;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:36px;padding:0 12px;border-radius:99px;border:var(--bw) solid var(--line);background:var(--panel2);font-size:12.5px;font-weight:700}
.chips button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tip{padding:0;overflow:hidden}
.tip>button{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left}
.tip .tt{flex:1;min-width:0;display:grid;gap:2px}
.tip .tt b{font-size:15.5px}
.tip .tt span{font-size:13px;color:var(--muted)}
.tip .body{padding:0 14px 14px;display:grid;gap:10px;font-size:14px}
.tip .cat{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);padding:2px 8px;border:1px solid var(--acc);border-radius:99px;white-space:nowrap}
:root[data-qt="day"] .tip .cat{color:#9a6a00;border-color:#d99a00}
.tip .chev{transition:transform .15s}

/* ================= game logic ================= */
function isDue(t,k){
  if(t.archived&&k>=t.archived)return false;
  const s=t.sched;
  if(s.type==='once')return k===s.date;
  if(s.type==='interval'){
    if(k<s.start)return false;
    return (dayNum(k)-dayNum(s.start))%Math.max(1,s.every)===0;
  }
  if(k<t.created)return false;
  if(s.type==='daily')return true;
  if(s.type==='weekdays')return wd(k)<5;
  if(s.type==='days')return (s.days||[]).indexOf(wd(k))>=0;
  return false;
}
const cnt=(t,k)=>((logs[k]&&logs[k][t.id])||[]).length;
function dayStats(k){
  let due=0,done=0;
  for(const t of S.tasks){ if(isDue(t,k)){due+=t.reps;done+=Math.min(t.reps,cnt(t,k));} }
  return {due:due,done:done,pct:due?done/due*100:null};
}
function rangeStats(a,b){
  const today=todayKey();if(b>today)b=today;
  let due=0,done=0;
  for(let k=a;k<=b;k=addDays(k,1)){const s=dayStats(k);due+=s.due;done+=s.done}
  return {due:due,done:done,pct:due?done/due*100:null};
}
const perfect=st=>st.due>=2&&st.done>=st.due;
function totalXp(){
  let x=S.wheel.bonusXp||0;
  for(const k in logs){
    for(const id in logs[k])for(const ev of logs[k][id])x+=ev[1];
    if(perfect(dayStats(k)))x+=BONUS;
  }
  return x;
}
function firstDay(){
  let f=todayKey();
  for(const t of S.tasks){
    const c=[t.created];
    if(t.sched.type==='interval')c.push(t.sched.start);
    if(t.sched.type==='once')c.push(t.sched.date);
    for(const k of c)if(k<f)f=k;
  }
  return f;
}
function streakInfo(){
  const th=S.settings.streakPct,today=todayKey(),f=firstDay();
  let run=0,best=0,perf=0,start=null;
  for(let k=f;k<=today;k=addDays(k,1)){
    const st=dayStats(k);
    if(st.pct==null)continue;
    if(perfect(st))perf++;
    if(st.pct>=th){if(run===0)start=k;run++;if(run>best)best=run}
    else if(k!==today){run=0;start=null}
  }
  return {cur:run,best:best,perfect:perf,start:start};
}
/* A streak week: enough days (5, 6 or 7, from the rule valid for that week) reach the streak percentage. */
function tokenDaysFor(ws){let d=7;for(const r of S.settings.tokenRules)if(r.from<=ws)d=r.days;return d}
function weekQualifies(ws){
  const th=S.settings.streakPct,today=todayKey();let q=0;
  for(let i=0;i<7;i++){const k=addDays(ws,i);if(k>today)break;const st=dayStats(k);if(st.pct!=null&&st.pct>=th)q++}
  return q>=tokenDaysFor(ws);
}
function earnedTokens(){
  const today=todayKey();let n=0;
  for(let ws=weekStart(firstDay());ws<=today;ws=addDays(ws,7))if(weekQualifies(ws))n++;
  return n;
}
const tokensAvail=()=>Math.max(0,earnedTokens()-(S.wheel.spent||0));
function cellState(t,k){
  if(!isDue(t,k))return {s:'na'};
  const today=todayKey(),n=cnt(t,k);
  if(n>=t.reps)return {s:'done'};
  if(k>today)return {s:'future'};
  if(n>0)return {s:'part',n:n,reps:t.reps};
  return k===today?{s:'pending'}:{s:'miss'};
}
function questScores(a,b){
  const today=todayKey();if(b>today)b=today;const rows=[];
  for(const t of S.tasks){
    let due=0,done=0;
    for(let k=a;k<=b;k=addDays(k,1))if(isDue(t,k)){due+=t.reps;done+=Math.min(t.reps,cnt(t,k))}
    if(due)rows.push({t:t,due:due,done:done,p:done/due*100});
  }
  return rows;
}
function upcoming(t,n){
  const out=[];let k=todayKey();
  for(let i=0;i<400&&out.length<n;i++){if(isDue(t,k))out.push(k);k=addDays(k,1)}
  return out;
}
function describe(t){
  const s=t.sched;let a;
  if(s.type==='daily')a='Every day';
  else if(s.type==='weekdays')a='Mon–Fri';
  else if(s.type==='days'){const d=(s.days||[]).slice().sort((x,y)=>x-y);a=d.length===7?'Every day':d.length===1?'Every '+WD[d[0]]:d.map(i=>WD[i]).join(', ')||'No days picked'}
  else if(s.type==='interval')a=s.every===1?'Every day':'Every '+s.every+' days';
  else a='Once · '+fmtDate(s.date);
  return (t.reps>1?t.reps+'× a day · ':'')+a;
}

const LS='questlog.v2', LS_OLD='questlog.v1';
const storage={db:null,base:null,mode:'device',state:'saved'};
const dirty=new Map(), knownDocs=new Set();
let flushing=false, flushTimer=null;

function persistLocal(){try{localStorage.setItem(LS,JSON.stringify({S:S,logs:logs}))}catch(e){}}
const monthDoc=k=>'m-'+k.slice(0,7);
function docBody(id){
  if(id==='main')return {v:2,tasks:S.tasks,settings:S.settings,profile:S.profile,wheel:S.wheel,seen:S.seen,hint:S.hint,events:S.events};
  const days={};

  return {days:days};
}
function saveText(){
  if(storage.mode==='account')return storage.state==='error'?'Could not reach your account. Changes are kept on this device and retried.':storage.state==='saving'?'Saving to your Claude account…':'Saved to your Claude account.';
  return 'Saved on this device only.';
}
function setSaveState(s){storage.state=s;const el=$('#save-state');if(el)el.textContent=saveText()}
function mark(id,op){
  op=op||'set';
  dirty.set(id,op);
  if(op==='delete')knownDocs.delete(id);else knownDocs.add(id);
  persistLocal();scheduleSoon();
  if(storage.db){setSaveState('saving');clearTimeout(flushTimer);flushTimer=setTimeout(flush,500)}
}
async function flush(){
  if(flushing||!storage.db)return;
  flushing=true;
  let id=null,op=null;
  try{
    while(dirty.size){
      const e=dirty.entries().next().value;id=e[0];op=e[1];dirty.delete(id);
      const ref=storage.base.doc(id);
      if(op==='delete')await ref.delete();else await ref.set(docBody(id));
      id=null;
    }
    setSaveState('saved');
  }catch(err){
    if(id)dirty.set(id,op);
    setSaveState('error');
    clearTimeout(flushTimer);flushTimer=setTimeout(flush,8000);
  }finally{flushing=false}
}
function applyDocs(docs){
  let main=null;const nl={};knownDocs.clear();
  for(const d of docs){
    const data=d.data(); if(!data)continue;
    knownDocs.add(d.id);
    if(d.id==='main')main=clone(data);
    else if(d.id.indexOf('m-')===0)Object.assign(nl,clone(data.days||{}));
  }
  if(!main)return false;
  S=fixState(main);logs=nl;persistLocal();return true;
}
async function initStorage(){
  let local=null;
  try{const raw=localStorage.getItem(LS)||localStorage.getItem(LS_OLD);if(raw)local=JSON.parse(raw)}catch(e){}
  const c=window.claude;
  if(c&&c.use){
    try{
      const user=await c.use('user'), db=await c.use('db');
      const uid=user&&await user.id();
      if(db&&uid){storage.db=db;storage.base=db.collection('data/users/'+uid);storage.mode='account'}
    }catch(e){}
  }
  if(storage.db){
    try{
      const snap=await storage.base.get();
      if(!snap.empty&&applyDocs(snap.docs))return;
    }catch(e){storage.db=null;storage.mode='device'}
  }
  if(local&&local.S){S=fixState(local.S);logs=local.logs||{}}
  else{S=defaults();logs={}}
  if(storage.db){mark('main');for(const k in logs)mark(monthDoc(k))}
  else persistLocal();
}
async function refreshFromDb(){
  if(!storage.db||dirty.size||flushing)return;
  try{const snap=await storage.base.get();if(!dirty.size&&!flushing&&!snap.empty&&applyDocs(snap.docs)){applyLook();render()}}catch(e){}
}
function replaceAll(newS,newLogs){
  const old=new Set(knownDocs);
  S=fixState(newS);logs=newLogs||{};
  const keep=new Set(['main']);
  for(const k in logs)keep.add(monthDoc(k));
  keep.forEach(id=>mark(id));
  old.forEach(id=>{if(!keep.has(id))mark(id,'delete')});
  persistLocal();
}

function setBg(file){
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
    const m=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*m);c.height=Math.round(img.height*m);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(async b=>{
      if(!b){toast('Could not read that picture');return}
      await sstore.put('bg',b);if(bgUrl)URL.revokeObjectURL(bgUrl);
      bgUrl=URL.createObjectURL(b);applyBg();if(sheet==='settings')drawSettings();toast('Background set');
    },'image/jpeg',.82);
  };
  img.onerror=()=>{URL.revokeObjectURL(u);toast('Could not read that picture')};
  img.src=u;
}
function applyLook(){

const CONF=['#ffc83d','#4be08a','#6cd7ff','#ff6b9a','#ffffff','#ff9a3d'];
let parts=[],raf=0,cW=0,cH=0,cD=1;
function confetti(x,y,n,power){
  if(reduceMotion())return;
  const cv=$('#confetti');if(!cv)return;
  cD=Math.min(2,window.devicePixelRatio||1);cW=window.innerWidth;cH=window.innerHeight;
  cv.width=Math.round(cW*cD);cv.height=Math.round(cH*cD);cv.style.width=cW+'px';cv.style.height=cH+'px';
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(rnd(1)-.5)*Math.PI*1.15,v=(4+rnd(9))*power;
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+rnd(6),h:3+rnd(5),r:rnd(6.28),vr:(rnd(1)-.5)*.45,c:CONF[Math.floor(rnd(CONF.length))],life:0});
  }
  if(!raf)raf=requestAnimationFrame(confStep);
}
function confStep(){
  const cv=$('#confetti'),cx=cv.getContext('2d');
  cx.setTransform(cD,0,0,cD,0,0);cx.clearRect(0,0,cW,cH);
  parts=parts.filter(p=>p.y<cH+30&&p.life<150);
  for(const p of parts){
    p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,(150-p.life)/40);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
  }
  if(parts.length)raf=requestAnimationFrame(confStep);else{raf=0;cx.clearRect(0,0,cW,cH)}
}

function beep(f,dur,when,vol,type){
  if(!actx)return;
  try{
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+(when||0);
    o.type=type||'square';o.frequency.value=f;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||.12,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t);o.stop(t+dur+.03);
  }catch(e){}
}

const snoozed=[];
let fired=new Set();
try{fired=new Set(JSON.parse(localStorage.getItem(LS+'.fired')||'[]'))}catch(e){}
function saveFired(){try{const t=todayKey();localStorage.setItem(LS+'.fired',JSON.stringify(Array.from(fired).filter(x=>x.indexOf(t)===0)))}catch(e){}}
function ringTask(t,tm,slot,late){
  pushAlert({kick:late?'Quest overdue':'Quest time',title:t.name,text:'Scheduled for '+tm,loop:true,data:{id:t.id,time:tm,slot:slot},
    acts:[{label:'Done, +XP',act:'alarm-done',primary:1},{label:'Snooze 10 min',act:'alarm-snooze'},{label:'Dismiss',act:'alert-ok'}]});
}
function checkAlarms(){
  const now=new Date(),k=dkey(now),nm=now.getHours()*60+now.getMinutes();
  for(const t of S.tasks){
    if(!t.alarm||!isDue(t,k))continue;
    const n=cnt(t,k);
    sortedTimes(t).forEach((tm,i)=>{
      if(n>i||i>=t.reps)return;
      const key=k+'|'+t.id+'|'+i,m=toMin(tm);
      if(!fired.has(key)&&nm>=m&&nm-m<=10){fired.add(key);saveFired();ringTask(t,tm,i,nm-m>=2)}
    });
  }
  for(const e of S.events){
    if(e.date!==k||!e.remind||e.done)continue;
    const key=k+'|e|'+e.id;
    if(!fired.has(key)&&nm>=e.start&&nm-e.start<=10){fired.add(key);saveFired();pushAlert({kick:'Plan time',title:e.title,text:fmtMin(e.start)+' – '+fmtMin(e.end),loop:true,acts:[{label:'Dismiss',act:'alert-ok',primary:1}]})}
  }
  for(const s of snoozed.slice()){
    if(Date.now()>=s.until){
      snoozed.splice(snoozed.indexOf(s),1);
      const t=S.tasks.find(x=>x.id===s.id);
      if(t&&cnt(t,k)<=s.slot)ringTask(t,s.time,s.slot,true);
    }
  }
}
function nextAlarmInfo(){
  const now=new Date(),k=dkey(now),nm=now.getHours()*60+now.getMinutes();let best=null;
  for(const t of S.tasks){
    if(!t.alarm||!isDue(t,k))continue;
    const n=cnt(t,k);
    sortedTimes(t).forEach((tm,i)=>{if(n>i||i>=t.reps)return;const m=toMin(tm);if(m>nm&&(!best||m<best.m))best={m:m,name:t.name}});
  }
  return best;
}

/* ================= completing quests ================= */
function bump(id,k,delta,origin){
  if(k!==todayKey()){toast('You can only change today\'s quests');return}
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const arr=((logs[k]&&logs[k][id])||[]).slice();
  if(delta>0&&arr.length>=t.reps)return;
  if(delta<0&&!arr.length)return;
  const b={xp:totalXp(),st:dayStats(k),sk:streakInfo(),earned:earnedTokens()};
  if(delta>0)arr.push([minuteNow(),XP[t.diff]]);else arr.pop();
  logs[k]=logs[k]||{};
  if(arr.length)logs[k][id]=arr;else{delete logs[k][id];if(!Object.keys(logs[k]).length)delete logs[k]}
  mark(monthDoc(k));
  const a={xp:totalXp(),st:dayStats(k),sk:streakInfo(),earned:earnedTokens()};
  if(delta>0)ui.pop=id;
  render();
  if(delta>0){
    playSlot('check');
    if(origin)confetti(origin.x,origin.y,28,.8);
    const bonusNow=perfect(a.st)&&!perfect(b.st);
    toast(bonusNow?'Day cleared! +'+(XP[t.diff]+BONUS)+' XP':'+'+XP[t.diff]+' XP');
    const lvB=levelInfo(b.xp).lvl,lvA=levelInfo(a.xp).lvl;
    if(lvA>lvB)queuePopup(()=>levelUpPopup(lvA));
    if(a.sk.cur>b.sk.cur)maybeStreak(a.sk);
    if(a.earned>b.earned&&earnedTokens()>(S.wheel.spent||0))queuePopup(tokenPopup);
  }
}
function maybeStreak(sk){
  const n=sk.cur;let ok=false;
  if(n===2&&!S.seen.first2){S.seen.first2=true;ok=true}
  else if(n>=7&&n%7===0){const key=(sk.start||'')+'|'+n;if(S.seen.celebrated.indexOf(key)<0){S.seen.celebrated.push(key);ok=true}}
  if(ok){mark('main');queuePopup(()=>streakPopup(n))}
}
function tick(id,origin){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const k=todayKey();
  if(t.reps===1&&cnt(t,k)>=1)bump(id,k,-1);else bump(id,k,1,origin);
}

/* ================= wheel ================= */
let wheelRot=0,spinning=false;
function openWheel(){sheet='wheel';drawWheel()}
function wheelSVG(){
  const R=140,pt=(deg,r)=>[150+r*Math.sin(deg*Math.PI/180),150-r*Math.cos(deg*Math.PI/180)];
  let acc=0,out='';
  for(const s of WHEEL){
    const a0=acc,a1=acc+s.w*3.6,p0=pt(a0,R),p1=pt(a1,R),mid=(a0+a1)/2,lp=pt(mid,R*.66);
    out+='<path d="M150 150 L'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A'+R+' '+R+' 0 '+(a1-a0>180?1:0)+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+' Z" fill="'+s.c+'" stroke="rgba(255,255,255,.85)" stroke-width="2"/>';
    const flip=mid>90&&mid<270?180:0;
    out+='<g transform="rotate('+mid.toFixed(1)+' 150 150)"><text x="150" y="'+(150-R*.66).toFixed(1)+'" transform="rotate('+flip+' 150 '+(150-R*.66).toFixed(1)+')" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="'+(s.w<10?13:16)+'" font-weight="800" font-family="Figtree,sans-serif">'+s.label+'</text></g>';
    acc=a1;
  }
  return '<svg viewBox="0 0 300 300" aria-hidden="true"><g class="rot" id="wheel-rot" style="transform:rotate('+wheelRot+'deg)">'+out+'</g><circle cx="150" cy="150" r="22" fill="var(--panel)" stroke="var(--acc)" stroke-width="4"/><circle cx="150" cy="150" r="146" fill="none" stroke="var(--acc)" stroke-width="6"/></svg>';
}
function drawWheel(msg){
  const tok=tokensAvail();
  $('#sheet-root').innerHTML='<div class="scrim" data-act="close-sheet"></div><section class="sheet" role="dialog" aria-label="Spin the wheel">'
    +'<div class="sheet-head"><h2>Streak wheel</h2><button class="icon-btn" data-act="close-sheet" aria-label="Close">'+ic('close',22)+'</button></div><div class="sheet-body" style="justify-items:center;text-align:center">'
    +'<div class="wheelwrap"><svg class="pointer" viewBox="0 0 28 34" aria-hidden="true"><path d="M14 33 L2 6 Q14 -2 26 6 Z" fill="var(--acc)" stroke="var(--acc-ink)" stroke-width="2"/></svg>'+wheelSVG()+'</div>'
    +'<p id="wheel-msg" class="'+(msg?'':'hint')+'" style="min-height:44px;font-weight:700;font-size:17px">'+(msg||(tok>0?'You have '+tok+' token'+(tok>1?'s':'')+'. The size of each slice is its real chance.':'No tokens yet. Complete a streak week to earn one.'))+'</p>'
    +'<button class="btn primary" id="spin-btn" data-act="spin"'+(tok>0&&!spinning?'':' disabled')+'>'+ic('star',18)+' Spin</button>'
    +'</div></section>';
  document.documentElement.style.overflow='hidden';
}
function spin(){
  if(spinning||tokensAvail()<1)return;
  let phi=0,seg=null;
  for(let tries=0;tries<20;tries++){
    phi=rnd(360);let acc=0;seg=null;let edge=false;
    for(const s of WHEEL){const a1=acc+s.w*3.6;if(phi>=acc&&phi<a1){seg=s;if(phi-acc<1.5||a1-phi<1.5)edge=true;break}acc=a1}
    if(seg&&!edge)break;
  }
  if(!seg)seg=WHEEL[0];
  const lvB=levelInfo(totalXp()).lvl,w=S.wheel;
  let text='';
  const pick=(pool,own)=>{const left=pool.filter(x=>own.indexOf(x.id)<0);return left.length?left[Math.floor(rnd(left.length))]:null};
  if(seg.k==='medal'){const m=pick(MEDALS,w.medals);if(m){w.medals.push(m.id);text='Medal: '+m.name}else{w.bonusXp+=50;text='+50 XP (all medals collected)'}}
  else if(seg.k==='title'){const t=pick(TITLES,w.titles);if(t){w.titles.push(t.id);text='Title: '+t.name}else{w.bonusXp+=50;text='+50 XP (all titles collected)'}}
  else if(seg.k==='flame'){const f=pick(FLAMES.filter(x=>x.id!=='classic'),w.flames);if(f){w.flames.push(f.id);text='New flame: '+f.name}else{w.bonusXp+=50;text='+50 XP (all flames collected)'}}
  else{const n=seg.k==='xp25'?25:seg.k==='xp50'?50:100;w.bonusXp+=n;text='+'+n+' XP'}
  w.spent=(w.spent||0)+1;w.history.push({t:Date.now(),r:text});if(w.history.length>50)w.history.shift();
  mark('main');
  spinning=true;
  const target=wheelRot+1800+((360-phi)-(wheelRot%360)+360)%360;wheelRot=target;
  const btn=$('#spin-btn');if(btn)btn.disabled=true;
  const m=$('#wheel-msg');if(m){m.className='';m.textContent='Spinning…'}
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{const r=$('#wheel-rot');if(r)r.style.transform='rotate('+target+'deg)'})});
  setTimeout(()=>{
    spinning=false;renderHero();
    playSlot('streak');confetti(window.innerWidth/2,window.innerHeight*.45,90,1);
    if(sheet==='wheel')drawWheel('You won: '+text);else toast('You won: '+text);
    if(levelInfo(totalXp()).lvl>lvB)queuePopup(()=>levelUpPopup(levelInfo(totalXp()).lvl));
  },5300);

const NL=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
let nsT=null,nsReady=false;
function nid(str){let h=7;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return Math.abs(h)%2000000000+1}
async function scheduleNative(){
  const P=NL();if(!P)return;
  try{
    if(!nsReady){
      const pr=await P.requestPermissions();if(pr.display!=='granted')return;
      try{await P.createChannel({id:'questlog-alarm',name:'Quest alarms',description:'Rings for quests and plans',importance:5,visibility:1,sound:'alarm.wav',vibration:true,lights:true})}catch(e){}
      try{await P.createChannel({id:'questlog-progress',name:'Daily progress',description:'Silent notification with your progress today',importance:2,visibility:1,vibration:false,lights:false})}catch(e){}
      nsReady=true;
    }
    const pend=await P.getPending();
    if(pend.notifications&&pend.notifications.length)await P.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const now=new Date(),tk=todayKey(),list=[];
    for(let d=0;d<7;d++){
      const k=addDays(tk,d),base=pk(k);
      const add=(key,m,title,body)=>{const at=new Date(base.getFullYear(),base.getMonth(),base.getDate(),Math.floor(m/60),m%60,0);if(at>now)list.push({id:nid(key),title:title,body:body,schedule:{at:at,allowWhileIdle:true},channelId:'questlog-alarm',sound:'alarm.wav'})};
      for(const t of S.tasks){if(!t.alarm||!isDue(t,k))continue;sortedTimes(t).slice(0,t.reps).forEach((x,i)=>{if(d===0&&cnt(t,k)>i)return;add(k+'|q|'+t.id+'|'+i,toMin(x),t.name,'Quest time · '+x)})}
      for(const e of S.events){if(e.date!==k||!e.remind||(d===0&&evDone(e)))continue;add(k+'|e|'+e.id,e.start,e.title,'Plan · '+fmtMin(e.start)+' – '+fmtMin(e.end))}
    }
    const mid=await postProgress(P,tk),all=list.slice(0,60);
    if(mid)all.push(mid);
    if(all.length)await P.schedule({notifications:all});
  }catch(err){}
}
function progItem(k){
  const st=dayStats(k),dn=Math.abs(Math.round(dayNum(k)));
  return {id:1,title:st.due?'Today: '+st.done+' of '+st.due+' done · '+Math.round(st.pct||0)+'%':'No quests due today',body:SLOGANS[dn%SLOGANS.length],channelId:'questlog-progress',ongoing:true,autoCancel:false};
}
async function postProgress(P,tk){
  try{await P.removeDeliveredNotifications({notifications:[{id:1}]})}catch(e){}
  if(S.settings.progNotif===false)return null;
  await P.schedule({notifications:[progItem(tk)]});
  const t1=addDays(tk,1),b=pk(t1),it=progItem(t1);
  it.schedule={at:new Date(b.getFullYear(),b.getMonth(),b.getDate(),0,0,10),allowWhileIdle:true};
  return it;
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet&&sheet!=='reset'){closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('li.task[data-act="tick"]')){e.preventDefault();e.target.click()}
});

/* ================= boot ================= */
let lastToday=todayKey(),lastMinute=-1;
function heartbeat(){
  const t=todayKey();
  if(t!==lastToday){if(ui.view===lastToday)ui.view=t;lastToday=t;ui.cal=monthKey(t);ui.calSel=t;ui.sWeek=weekStart(t);ui.qsAnchor=t;render()}
  checkAlarms();
  const m=minuteNow();
  if(m!==lastMinute){lastMinute=m;if(!sheet&&ui.tab==='today'&&ui.view===t)render()}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    heartbeat();pomoTick();refreshFromDb();
    if(S.settings.awake&&!wake)setAwake(true);
  }
});
/*TEST_HOOK*/
(async function boot(){
  const init=initStorage();
  await Promise.race([init,new Promise(r=>setTimeout(r,4000))]);
  applyLook();render();
  init.then(()=>{applyLook();render()});
  loadSounds();scheduleSoon();
  heartbeat();
  setInterval(heartbeat,15000);
  setInterval(pomoTick,500);
  if(S.settings.awake)setAwake(true);
})();
})();
</script>
